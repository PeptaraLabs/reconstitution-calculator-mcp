# Smithery deployment config. Runs the server as a container speaking Streamable HTTP on /mcp.
# Smithery sets PORT; the Dockerfile sets HOST=0.0.0.0 and TRANSPORT=http.
runtime: "container"
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "http"
  configSchema:
    type: "object"
    properties: {}
  exampleConfig: {}
